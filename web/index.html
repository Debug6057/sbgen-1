<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sbgen</title>
    <meta
      name="description"
      content="Generates compact directives for custom Starbound sprites, in the browser."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>sbgen</h1>
      <p class="sub">
        Compact directives for custom Starbound sprites. Everything runs in your
        browser, no image leaves it.
      </p>
      <div id="tabs" role="tablist"></div>
      <p id="help"></p>
      <form id="form"></form>
      <span id="status" role="status"></span>
      <p id="error" role="alert" hidden></p>
      <section id="result" hidden>
        <p id="description"></p>
        <textarea id="output" readonly spellcheck="false"></textarea>
        <div class="row">
          <button id="copy" type="button">Copy</button
          ><button id="download" type="button">Download</button>
        </div>
      </section>
      <footer>
        <a href="https://github.com/OpenStarbound/sbgen">Source on GitHub</a>
      </footer>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
